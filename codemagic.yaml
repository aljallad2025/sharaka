workflows:
  sharaka-android:
    name: Sharaka - Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.superai.sharaka"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (Debug/Release للاختبار السريع)
        script: |
          flutter build apk --release
      - name: Build AppBundle (لرفع Google Play)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
